apiVersion: v1
kind: Pod
metadata:
  name: emptydir-demo
  labels:
    app: emptydir-demo
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          while true; do
            echo "$(date) - writer" >> /cache/log.txt
            sleep 5
          done
      volumeMounts:
        - name: cache-volume
          mountPath: /cache
      resources:
        requests: { cpu: "20m", memory: "16Mi" }
        limits: { cpu: "50m", memory: "32Mi" }
    - name: reader
      image: busybox:1.36
      command: ["/bin/sh", "-c", "tail -f /cache/log.txt"]
      volumeMounts:
        - name: cache-volume
          mountPath: /cache
          readOnly: true
      resources:
        requests: { cpu: "20m", memory: "16Mi" }
        limits: { cpu: "50m", memory: "32Mi" }
  volumes:
    - name: cache-volume
      emptyDir:
        sizeLimit: 100Mi