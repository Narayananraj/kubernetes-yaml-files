apiVersion: v1
kind: Pod
metadata:
  name: pvc-demo
  labels:
    app: pvc-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "Written at $(date)" >> /data/persist.txt
          cat /data/persist.txt
          sleep 3600
      volumeMounts:
        - name: storage
          mountPath: /data
      resources:
        requests: { cpu: "20m", memory: "16Mi" }
        limits: { cpu: "50m", memory: "32Mi" }
  volumes:
    - name: storage
      persistentVolumeClaim:
        claimName: app-data-pvc