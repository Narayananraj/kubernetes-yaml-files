apiVersion: v1
kind: Pod
metadata:
  name: slow-start-demo
  labels:
    app: slow-start-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "Simulating slow init (25s)..."
          sleep 25
          echo "Ready" > /tmp/ready
          while true; do sleep 3600; done
      startupProbe:
        exec:
          command: ["cat", "/tmp/ready"]
        periodSeconds: 3
        failureThreshold: 15
      livenessProbe:
        exec:
          command: ["cat", "/tmp/ready"]
        periodSeconds: 5
        failureThreshold: 2
      resources:
        requests: { cpu: "20m", memory: "16Mi" }
        limits: { cpu: "50m", memory: "32Mi" }