apiVersion: v1
kind: Pod
metadata:
  name: config-demo
  labels:
    app: config-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "APP_ENV=$APP_ENV"
          echo "LOG_LEVEL=$LOG_LEVEL"
          echo "--- mounted file ---"
          cat /etc/config/nginx.conf
          sleep 3600
      envFrom:
        - configMapRef:
            name: web-app-config
      env:
        - name: MAX_CONN_OVERRIDE
          valueFrom:
            configMapKeyRef:
              name: web-app-config
              key: MAX_CONNECTIONS
      volumeMounts:
        - name: config-volume
          mountPath: /etc/config
      resources:
        requests:
          cpu: "20m"
          memory: "16Mi"
        limits:
          cpu: "50m"
          memory: "32Mi"
  volumes:
    - name: config-volume
      configMap:
        name: web-app-config