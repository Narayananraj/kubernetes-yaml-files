apiVersion: v1
kind: Pod
metadata:
  name: nodeselector-demo
  labels:
    app: nodeselector-demo
spec:
  nodeSelector:
    kubernetes.io/hostname: practice-worker
  containers:
    - name: app
      image: nginx:1.27-alpine
      resources:
        requests: { cpu: "50m", memory: "32Mi" }
        limits: { cpu: "100m", memory: "64Mi" }