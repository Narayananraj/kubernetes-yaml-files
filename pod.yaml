apiVersion: v1
kind: pod
metadata:
  name: nginx-pod
  labels:
    app: nginx
    tier: frontend
spec:
  containers:
    - name: nginx-container
      image: nginx:1.27.alpine
      ports:
        - containerPort: 80
      resources:
        requests: 
          cpu: "100m" 
          memory: "128Mi"
        limits: 
          cpu: "250m"
          memory: "256Mi" 
      livenessProbe:
        httpGet:
          path: / 
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 10