apiVersion: v1
kind: Pod
metadata:
  name: secret-demo
  labels:
    app: secret-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "DB_USER=$DB_USER"
          echo "--- mounted secret file ---"
          cat /etc/secrets/DB_PASSWORD
          echo
          sleep 3600
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DB_USER
      volumeMounts:
        - name: secret-volume
          mountPath: /etc/secrets
          readOnly: true
      resources:
        requests:
          cpu: "20m"
          memory: "16Mi"
        limits:
          cpu: "50m"
          memory: "32Mi"
  volumes:
    - name: secret-volume
      secret:
        secretName: db-credentials
        defaultMode: 0400