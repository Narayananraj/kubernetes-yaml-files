apiVersion: v1
kind: Pod
metadata:
  name: gpu-workload
  labels:
    app: gpu-workload
spec:
  tolerations:
    - key: "dedicated"
      operator: "Equal"
      value: "gpu-team"
      effect: "NoSchedule"
  containers:
    - name: app
      image: nginx:1.27-alpine
      resources:
        requests: { cpu: "50m", memory: "32Mi" }
        limits: { cpu: "100m", memory: "64Mi" }